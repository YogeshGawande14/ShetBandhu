spring:
  application:
    name: AgroConnect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  profiles:
    default: mysql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
app:
  media:
    directory: ${MEDIA_DIRECTORY:uploads}
  admin:
    access-id: ${ADMIN_ACCESS_ID:}
    access-token-hash: ${ADMIN_ACCESS_TOKEN_HASH:}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-0123456789-abcdef}
    ttl-ms: ${JWT_TTL_MS:3600000}
agroconnect:
  market:
    data-gov-in:
      api-key: ${DATA_GOV_IN_API_KEY:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/agroconnect_db?serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    locations: classpath:db/migration/mysql
  jpa:
    show-sql: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
        jdbc:
          time_zone: UTC
logging:
  level:
    com.agroconnect: INFO
    org.hibernate.SQL: WARN
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agroconnect}
    username: ${DATABASE_USERNAME:agroconnect}
    password: ${DATABASE_PASSWORD:agroconnect}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
logging:
  level:
    com.agroconnect: INFO
    org.hibernate.SQL: WARN
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:agroconnect;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration/mysql
  jpa:
    show-sql: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
        jdbc:
          time_zone: UTC
logging:
  level:
    com.agroconnect: INFO
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
logging:
  level:
    root: INFO
    com.agroconnect: INFO
